<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Assembly &amp; Checkout | PSAC Ops</title>
<!--
  ops-gear-checkout.html

  Real, working version of claude/psac-ops-gear-assembly-checkout.html's
  mockup — Gear Inventory PRD Section 3/4, extended by Ops App Redesign
  (Aug 2026) Round 2 item 5. T-1 checkout queue, allocation (size-matched,
  shortage-flagged, now with a genuine Retry Allocation path — see the
  loadDetail() comment below), a combined packing checklist (QR-scan or
  manual entry for trackables, plain checkboxes + a "Confirm all remaining"
  bulk button for keepsakes — bulk items are never unit-tracked or written
  to the Sheet, purely client-side per Section 2), and the new three-state
  outbound delivery flow (Ready for Delivery -> Delivery Scheduled ->
  Delivered), replacing the old single "Mark Delivered" button. Wired to
  /api/ops-proxy -> api/allocate-gear-units.js and api/checkout-gear.js.

  Round 2 (Aug 2026): adopts the shared OpsShell (ops-shell.js/.css) for the
  sidebar, search bar, and branded loading convention — this page used to be
  fully self-contained; see ops-shell.js's own header for why that changed.

  QR scanning uses the browser's native BarcodeDetector API when available
  (Chrome/Edge on Android and recent desktop Chrome) — no scanning library
  dependency added for this. Manual unit-ID entry is always present and
  equally weighted, never a fallback bolted on as an afterthought — per
  Section 4/6, staff on a phone with a cracked camera or a QR label that
  won't scan need the same path, not a degraded one.
-->
<link rel="stylesheet" href="ops-shell.css">
<style>
  :root {
    --amber-bg: rgba(154,91,30,0.12); --amber-text: #9A5B1E; --amber-border: rgba(154,91,30,0.35);
  }
  .ops-breadcrumb { font-size:0.78rem; margin-bottom:0.8rem; }
  .ops-breadcrumb a { color:var(--mountain-pink); text-decoration:none; cursor:pointer; }

  .ops-select, .ops-input { padding:0.6rem 0.8rem; border:1px solid var(--ops-border); border-radius:5px; font-size:0.85rem; color:var(--ops-text); background:white; }
  .ops-panel { border:1px solid var(--ops-border); border-radius:8px; padding:1.2rem 1.4rem; margin-bottom:1.2rem; }
  .ops-panel-title { font-size:0.9rem; font-weight:700; margin-bottom:0.7rem; color:var(--dark-pine); }
  .ops-btn-small { background:white; border:1px solid var(--ops-border); color:var(--ops-text); border-radius:4px; padding:0.3rem 0.6rem; font-size:0.72rem; cursor:pointer; }

  .ops-table th { text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); padding:0.6rem 0.8rem; border-bottom:2px solid var(--ops-border); }
  .ops-table td { padding:0.6rem 0.8rem; border-bottom:1px solid var(--ops-border); vertical-align:middle; }

  .unit-chip { display:inline-block; background:var(--ops-bg); border:1px solid var(--ops-border); border-radius:4px; padding:0.15rem 0.5rem; font-size:0.74rem; font-family:monospace; }
  .shortage-box { background:var(--amber-bg); border:1px solid var(--amber-border); color:var(--amber-text); border-radius:6px; padding:0.9rem 1rem; margin-bottom:1rem; font-size:0.83rem; }
  .shortage-actions { display:flex; gap:0.5rem; margin-top:0.6rem; flex-wrap:wrap; }
  .shortage-actions button { background:white; border:1px solid var(--amber-border); color:var(--amber-text); border-radius:4px; padding:0.35rem 0.7rem; font-size:0.74rem; cursor:pointer; }
  .retry-allocation-row { margin-bottom:1rem; }

  .checklist-row { display:flex; align-items:center; justify-content:space-between; padding:0.6rem 0.2rem; border-bottom:1px solid var(--ops-border); font-size:0.85rem; }
  .checklist-row.scan-done { color:#2a7a4a; }
  .checklist-left { display:flex; align-items:center; gap:0.6rem; }
  .qr-icon { font-size:1.1rem; }
  .scan-panel { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
  .viewfinder { position:relative; width:220px; height:160px; background:#000; border-radius:6px; overflow:hidden; }
  .viewfinder video { width:100%; height:100%; object-fit:cover; }

  .ops-success-banner { background:rgba(122,189,145,0.15); color:#2a7a4a; border:1px solid rgba(122,189,145,0.4); border-radius:6px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:0.82rem; }
  .ops-mismatch-banner { background:var(--amber-bg); color:var(--amber-text); border:1px solid var(--amber-border); border-radius:6px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:0.82rem; }

  .bulk-checklist label { display:block; font-size:0.83rem; padding:0.3rem 0; }
  .bulk-checklist-footer { margin-top:0.6rem; }

  .delivery-state-banner { border-radius:6px; padding:0.7rem 1rem; font-size:0.83rem; margin-bottom:0.8rem; }
  .delivery-state-banner.ready { background:var(--amber-bg); color:var(--amber-text); border:1px solid var(--amber-border); }
  .delivery-state-banner.scheduled { background:rgba(42,111,151,0.1); color:#2A6F97; border:1px solid rgba(42,111,151,0.3); }
  .delivery-state-banner.delivered { background:rgba(122,189,145,0.15); color:#2a7a4a; border:1px solid rgba(122,189,145,0.4); }
  .window-hint { font-size:0.72rem; color:var(--ops-text-mid); margin-top:0.3rem; }
  .delivery-form-row { margin-bottom:0.9rem; }
  .delivery-form-row label { display:block; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ops-text-mid); margin-bottom:0.35rem; }

  @media (max-width: 760px) {
    .ops-table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .checklist-row { flex-direction:column; align-items:flex-start; gap:0.4rem; }
    .viewfinder { width:100%; }
  }
</style>
</head>
<body>

<div id="loading-gate">Checking sign-in…</div>

<div id="app-shell" class="hidden">
  <div class="ops-app">
    <div class="ops-sidebar" id="ops-sidebar"></div>
    <div class="ops-main">
      <div class="ops-topbar">
        <div>
          <div class="ops-title" id="ops-title"></div>
          <div class="ops-subtitle" id="ops-subtitle"></div>
        </div>
        <div class="ops-user"><span id="user-email"></span><button class="ops-signout" id="signout-btn">Sign out</button></div>
      </div>
      <div id="ops-search-container"></div>

      <div id="banner-container"></div>

      <div id="queue-view">
        <div style="margin-bottom:1rem;">
          <label style="font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ops-text-mid); margin-right:0.5rem;">Trip date</label>
          <input class="ops-input" id="queue-trip-date" type="date">
        </div>
        <div id="queue-list"><div class="ops-empty">Pick a date to load the checkout queue.</div></div>
      </div>

      <div id="detail-view" class="hidden">
        <div class="ops-breadcrumb"><a id="back-to-queue">&larr; Checkout queue</a></div>
        <div id="detail-content"></div>
      </div>
    </div>
  </div>
</div>

<script src="ops-shell.js"></script>
<script>
(function () {
  'use strict';

  var BULK_ITEMS = ['Sunscreen', 'LMNT electrolyte packets', 'Dates', 'Bandana', 'Membership card', 'Route card'];

  // Delivery Time dropdown options, per the guest's own Adventure Prep
  // deliveryWindow selection (adventure-prep-form.js's own three fixed
  // values). Defaults to 7pm-9pm's slots if the guest never picked a
  // window or picked something unrecognized — matching the journey map's
  // explicit default. 30-minute increments, none flush with the window's
  // own end (a 7pm start still has to leave time to actually deliver
  // before 9pm) — same four-slots-per-window shape as the design mockup.
  var DELIVERY_WINDOW_SLOTS = {
    '3:00pm – 5:00pm': ['3:00pm', '3:30pm', '4:00pm', '4:30pm'],
    '5:00pm – 7:00pm': ['5:00pm', '5:30pm', '6:00pm', '6:30pm'],
    '7:00pm – 9:00pm': ['7:00pm', '7:30pm', '8:00pm', '8:30pm'],
  };
  var DEFAULT_DELIVERY_WINDOW = '7:00pm – 9:00pm';

  var currentBookingId = null;
  var currentAllocation = [];
  var currentDeliveryContext = null;
  var scanStream = null;
  var scanDetector = null;

  var opsCall = OpsShell.opsCall;
  var escapeHtml = OpsShell.escapeHtml;

  function showBanner(kind, message) {
    var cls = kind === 'success' ? 'ops-success-banner' : (kind === 'mismatch' ? 'ops-mismatch-banner' : 'ops-error-banner');
    document.getElementById('banner-container').innerHTML = '<div class="' + cls + '">' + escapeHtml(message) + '</div>';
  }

  // -------------------- Queue --------------------

  function loadQueue() {
    var tripDate = document.getElementById('queue-trip-date').value;
    if (!tripDate) return;
    OpsShell.withLoadingState(document.getElementById('queue-list'), function () {
      return opsCall('gearCheckout_getQueue', { tripDate: tripDate }).then(function (result) {
        if (!result.ok) { document.getElementById('queue-list').innerHTML = '<div class="ops-empty">Could not load the checkout queue.</div>'; return; }
        var bookings = result.data.bookings || [];
        if (!bookings.length) { document.getElementById('queue-list').innerHTML = '<div class="ops-empty">No active bookings for this trip date.</div>'; return; }
        var rows = bookings.map(function (b) {
          return '<tr>'
            + '<td>#' + escapeHtml(b.bookingId) + ' — ' + escapeHtml(b.contactName || '') + '</td>'
            + '<td>' + escapeHtml(b.tier || '') + '</td>'
            + '<td>' + escapeHtml(b.gearKitCount || '') + '</td>'
            + '<td>' + (b.gearDeliveredAt ? 'Delivered' : 'Pending') + '</td>'
            + '<td><button class="ops-btn-small" data-open="' + escapeHtml(b.bookingId) + '">Open</button></td>'
            + '</tr>';
        }).join('');
        document.getElementById('queue-list').innerHTML = '<table class="ops-table"><thead><tr><th>Booking</th><th>Tier</th><th>Kits</th><th>Delivery</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
        document.querySelectorAll('button[data-open]').forEach(function (btn) {
          btn.addEventListener('click', function () { openBooking(btn.getAttribute('data-open')); });
        });
      });
    });
  }

  // -------------------- Detail / allocation / checklist --------------------

  function openBooking(bookingId) {
    currentBookingId = bookingId;
    document.getElementById('queue-view').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    loadDetail();
  }

  /**
   * BUG FIX (Ops App Redesign, Aug 2026 — Round 2 item 5, Retry Allocation):
   * the old check was `if (!allocation.length || !anyAllocated)` — as soon
   * as ONE item had a unitId, a booking with a genuine partial shortage
   * (some items allocated, some not) skipped straight to the checklist
   * with shortages silently thrown away (gearAllocation_get doesn't return
   * a `shortages` array the way the one-time runAllocation() response
   * does — that was only ever populated right after an Allocate click).
   * Retry Allocation never had anything to attach to. Now: any booking
   * with unassigned items gets a "Retry Allocation (short N)" action
   * (re-runs allocation in case units freed up since — cleaning finished,
   * a return came in) shown alongside the checklist, not gated behind a
   * dead precondition that could never actually surface it. Shortage
   * context for display is reconstructed straight from the unassigned
   * allocation rows themselves (itemName/personName/kitNumber/itemType are
   * already on every allocation entry), not re-fetched separately.
   */
  function loadDetail() {
    OpsShell.withLoadingState(document.getElementById('detail-content'), function () {
      return Promise.all([
        opsCall('gearAllocation_get', { bookingId: currentBookingId }),
        opsCall('gearCheckout_getDeliveryContext', { bookingId: currentBookingId }),
      ]).then(function (results) {
        var allocResult = results[0];
        var deliveryResult = results[1];
        currentDeliveryContext = (deliveryResult.ok && deliveryResult.data) ? deliveryResult.data : {};
        if (!allocResult.ok) { document.getElementById('detail-content').innerHTML = '<div class="ops-empty">Could not load allocation.</div>'; return; }
        var allocation = allocResult.data.allocation || [];
        if (!allocation.length) {
          renderAllocatePrompt();
        } else {
          currentAllocation = allocation;
          renderChecklist();
        }
      });
    });
  }

  function renderAllocatePrompt() {
    document.getElementById('detail-content').innerHTML =
      '<div class="ops-panel">'
      + '<div class="ops-panel-title">#' + escapeHtml(currentBookingId) + '</div>'
      + '<p style="font-size:0.85rem; margin-bottom:0.8rem;">No gear has been allocated to this booking yet.</p>'
      + '<button class="ops-btn" id="allocate-btn">Allocate Gear</button>'
      + '</div>';
    document.getElementById('allocate-btn').addEventListener('click', runAllocation);
  }

  function runAllocation() {
    opsCall('gearAllocation_allocate', { bookingId: currentBookingId }).then(function (result) {
      if (!result.ok) { showBanner('error', (result.data && result.data.error) || 'Allocation failed.'); return; }
      currentAllocation = result.data.allocation || [];
      renderChecklist();
    });
  }

  function deriveShortages() {
    return currentAllocation.filter(function (item) { return !item.unitId; }).map(function (item) {
      return { itemType: item.itemType, label: item.itemName, personName: item.personName, kitNumber: item.kitNumber };
    });
  }

  function renderChecklist() {
    var shortages = deriveShortages();
    var html = '<div class="ops-panel"><div class="ops-panel-title">#' + escapeHtml(currentBookingId) + ' — packing checklist</div>';

    if (shortages.length) {
      html += '<div class="retry-allocation-row"><button class="ops-btn-secondary" id="retry-allocation-btn">Retry Allocation (short ' + shortages.length + ')</button></div>';
      shortages.forEach(function (s) {
        html += '<div class="shortage-box">Short 1 unit of <strong>' + escapeHtml(s.label) + '</strong> for '
          + escapeHtml(s.personName || ('kit ' + s.kitNumber)) + '.'
          + '<div class="shortage-actions">'
          + '<button data-resolve="reassign" data-item-type="' + escapeHtml(s.itemType) + '">Reassign</button>'
          + '<button data-resolve="expedite" data-item-type="' + escapeHtml(s.itemType) + '">Expedite cleaning</button>'
          + '<button data-resolve="contact-guest" data-item-type="' + escapeHtml(s.itemType) + '">Contact guest</button>'
          + '</div></div>';
      });
    }

    currentAllocation.forEach(function (item) {
      var done = !!item.checkedOutAt;
      var hasUnit = !!item.unitId;
      html += '<div class="checklist-row' + (done ? ' scan-done' : '') + '" data-row-unit="' + escapeHtml(item.unitId || '') + '">'
        + '<div class="checklist-left"><span class="qr-icon">' + (done ? '✅' : '📦') + '</span>'
        + '<span>' + escapeHtml(item.itemName) + ' — ' + escapeHtml(item.personName || ('Kit ' + item.kitNumber))
        + (hasUnit ? ' <span class="unit-chip">' + escapeHtml(item.unitId) + '</span>' : ' <span class="unit-chip">unassigned</span>') + '</span></div>'
        + (done ? '<span>Checked out</span>' : (hasUnit ? '<div class="scan-panel">'
          + '<button class="ops-btn-small" data-start-scan="' + escapeHtml(item.unitId) + '">Scan QR</button>'
          + '<input class="ops-input" style="width:120px; padding:0.4rem 0.6rem;" placeholder="Unit ID" data-manual-entry="' + escapeHtml(item.unitId) + '">'
          + '<button class="ops-btn-small" data-manual-confirm="' + escapeHtml(item.unitId) + '">Confirm</button>'
          + '</div>' : '<span style="color:var(--ops-text-mid); font-size:0.78rem;">Awaiting shortage resolution</span>'))
        + '</div>';
    });

    html += '</div>';

    html += '<div class="ops-panel"><div class="ops-panel-title">Bulk keepsakes (not unit-tracked)</div><div class="bulk-checklist">'
      + BULK_ITEMS.map(function (name, i) { return '<label><input type="checkbox" data-bulk-check="' + i + '"> ' + escapeHtml(name) + '</label>'; }).join('')
      + '<div class="bulk-checklist-footer"><button class="ops-btn-secondary" id="bulk-confirm-all-btn">Confirm all remaining (<span id="bulk-remaining-count">' + BULK_ITEMS.length + '</span>)</button></div>'
      + '</div></div>';

    var allTrackablesDone = currentAllocation.length > 0 && currentAllocation.every(function (i) { return i.checkedOutAt; });
    html += '<div class="ops-panel"><div class="ops-panel-title">Delivery</div><div id="delivery-section"></div><div id="scan-container" style="margin-top:1rem;"></div></div>';

    document.getElementById('detail-content').innerHTML = html;
    wireChecklistEvents();
    renderDeliverySection(allTrackablesDone);
  }

  function wireChecklistEvents() {
    document.querySelectorAll('button[data-resolve]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        opsCall('gearAllocation_recordShortageResolution', {
          bookingId: currentBookingId, itemType: btn.getAttribute('data-item-type'), resolution: btn.getAttribute('data-resolve'),
        }).then(function (result) {
          if (!result.ok) { showBanner('error', 'Could not record that resolution.'); return; }
          showBanner('success', 'Resolution recorded: ' + btn.getAttribute('data-resolve') + '.');
        });
      });
    });
    document.querySelectorAll('button[data-manual-confirm]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var expectedUnitId = btn.getAttribute('data-manual-confirm');
        var row = btn.closest('.checklist-row');
        var input = row.querySelector('input[data-manual-entry]');
        var entered = (input.value || '').trim() || expectedUnitId;
        confirmScan(entered);
      });
    });
    document.querySelectorAll('button[data-start-scan]').forEach(function (btn) {
      btn.addEventListener('click', function () { startScan(); });
    });
    var retryBtn = document.getElementById('retry-allocation-btn');
    if (retryBtn) retryBtn.addEventListener('click', runAllocation);
    wireBulkKeepsakes();
  }

  // Purely client-side — bulk keepsakes are never unit-tracked or written
  // to the Sheet (Section 2). The live count reflects however many boxes
  // are still unchecked, updating as staff check them individually or via
  // the bulk button — never touches the trackable-unit rows above it.
  function updateBulkRemainingCount() {
    var countEl = document.getElementById('bulk-remaining-count');
    if (!countEl) return;
    var remaining = document.querySelectorAll('input[data-bulk-check]:not(:checked)').length;
    countEl.textContent = remaining;
  }

  function wireBulkKeepsakes() {
    document.querySelectorAll('input[data-bulk-check]').forEach(function (cb) {
      cb.addEventListener('change', updateBulkRemainingCount);
    });
    var bulkAllBtn = document.getElementById('bulk-confirm-all-btn');
    if (bulkAllBtn) {
      bulkAllBtn.addEventListener('click', function () {
        document.querySelectorAll('input[data-bulk-check]').forEach(function (cb) { cb.checked = true; });
        updateBulkRemainingCount();
      });
    }
  }

  function confirmScan(scannedValue) {
    // The QR content is a URL (ops-gear-units.html?unit=XXXX) — pull the
    // unit ID out if it looks like one of our own URLs, otherwise treat
    // the scanned/typed value as a raw unit ID directly (manual entry).
    var unitId = scannedValue;
    var m = /[?&]unit=([^&]+)/.exec(scannedValue);
    if (m) unitId = decodeURIComponent(m[1]);

    opsCall('gearCheckout_confirmScan', { bookingId: currentBookingId, unitId: unitId }).then(function (result) {
      if (result.data && result.data.mismatch) {
        showBanner('mismatch', result.data.mismatch.detail || 'This unit does not match this booking.');
        return;
      }
      if (!result.ok || !result.data.ok) { showBanner('error', 'Could not confirm this item.'); return; }
      showBanner('success', (result.data.itemName || 'Item') + ' checked out.');
      stopScan();
      opsCall('gearAllocation_get', { bookingId: currentBookingId }).then(function (r2) {
        currentAllocation = (r2.data && r2.data.allocation) || currentAllocation;
        renderChecklist();
      });
    });
  }

  function startScan() {
    var container = document.getElementById('scan-container');
    if (!('BarcodeDetector' in window)) {
      container.innerHTML = '<div class="ops-helper" style="font-style:normal;">Camera-based scanning is not supported in this browser — use the manual Unit ID field on each item instead.</div>';
      return;
    }
    container.innerHTML = '<div class="viewfinder"><video id="scan-video" autoplay playsinline muted></video></div><div style="margin-top:0.5rem;"><button class="ops-btn-secondary" id="stop-scan-btn">Stop scanning</button></div>';
    document.getElementById('stop-scan-btn').addEventListener('click', stopScan);

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (stream) {
      scanStream = stream;
      var video = document.getElementById('scan-video');
      video.srcObject = stream;
      scanDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
      var poll = function () {
        if (!scanStream) return;
        scanDetector.detect(video).then(function (codes) {
          if (codes && codes.length) {
            confirmScan(codes[0].rawValue);
          } else {
            requestAnimationFrame(poll);
          }
        }).catch(function () { requestAnimationFrame(poll); });
      };
      requestAnimationFrame(poll);
    }).catch(function () {
      container.innerHTML = '<div class="ops-helper" style="font-style:normal;">Could not access the camera — use the manual Unit ID field on each item instead.</div>';
    });
  }

  function stopScan() {
    if (scanStream) { scanStream.getTracks().forEach(function (t) { t.stop(); }); scanStream = null; }
    var container = document.getElementById('scan-container');
    if (container) container.innerHTML = '';
  }

  // -------------------- Delivery: Ready for Delivery -> Delivery Scheduled -> Delivered --------------------

  function renderDeliverySection(allTrackablesDone) {
    var el = document.getElementById('delivery-section');
    if (!el) return;
    var ctx = currentDeliveryContext || {};
    var status = ctx.deliveryStatus || '';

    if (status === 'delivered') {
      el.innerHTML = '<div class="delivery-state-banner delivered">✓ Delivered' + (ctx.gearDeliveredBy ? ' — marked by ' + escapeHtml(ctx.gearDeliveredBy) : '') + (ctx.gearDeliveredAt ? ' — ' + escapeHtml(ctx.gearDeliveredAt) : '') + '</div>';
      return;
    }

    if (status === 'delivery_scheduled') {
      el.innerHTML = '<div class="delivery-state-banner scheduled">◐ Delivery Scheduled — ' + escapeHtml(deliveryServiceLabel(ctx.deliveryServiceType)) + ', ' + escapeHtml(ctx.deliveryTimeSlot || '') + '</div>'
        + '<button class="ops-btn" id="mark-delivered-final-btn">Mark Delivered</button>';
      document.getElementById('mark-delivered-final-btn').addEventListener('click', markDeliveredFinal);
      return;
    }

    if (status === 'ready_for_delivery') {
      el.innerHTML = '<div class="delivery-state-banner ready">◐ Ready for Delivery' + (ctx.deliveryReadyAt ? ' — ' + escapeHtml(ctx.deliveryReadyAt) : '') + '</div>'
        + renderScheduleDeliveryForm(ctx);
      wireScheduleDeliveryForm();
      return;
    }

    // Not started — Ready for Delivery keeps the exact same precondition
    // the old single "Mark Delivered" button always had: the packing
    // checklist 100% confirmed. It's just no longer the last step.
    if (allTrackablesDone) {
      el.innerHTML = '<button class="ops-btn" id="mark-ready-btn">Mark Ready for Delivery</button>';
      document.getElementById('mark-ready-btn').addEventListener('click', markReadyForDelivery);
    } else {
      el.innerHTML = '<p style="font-size:0.82rem; color:var(--ops-text-mid);">Every trackable item must be checked out before gear can be marked ready for delivery.</p>';
    }
  }

  function deliveryServiceLabel(v) {
    if (v === 'psac_staff') return 'PSAC Staff';
    if (v === 'uber_direct') return 'Uber Direct';
    return v || '';
  }

  function windowSlots(deliveryWindow) {
    return DELIVERY_WINDOW_SLOTS[deliveryWindow] || DELIVERY_WINDOW_SLOTS[DEFAULT_DELIVERY_WINDOW];
  }

  function renderScheduleDeliveryForm(ctx) {
    var deliveryWindow = ctx.deliveryWindow || DEFAULT_DELIVERY_WINDOW;
    var slots = windowSlots(deliveryWindow);
    return '<div style="margin-top:0.8rem;">'
      + '<div class="delivery-form-row"><label>Delivery Service</label>'
      + '<select class="ops-select" id="delivery-service-select">'
      + '<option value="psac_staff">PSAC Staff</option>'
      + '<option value="uber_direct">Uber Direct</option>'
      + '</select></div>'
      + '<div class="delivery-form-row"><label>Delivery Time</label>'
      + '<select class="ops-select" id="delivery-time-select">'
      + slots.map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join('')
      + '</select>'
      + '<div class="window-hint">Constrained to the guest\'s own delivery window: ' + escapeHtml(deliveryWindow) + '</div>'
      + '</div>'
      + '<div class="ops-helper">Selecting Uber Direct is what triggers the courier dispatch call (bucket 2.11) — the dispatch flow itself is a separate, out-of-scope build track; this only records the choice.</div>'
      + '<button class="ops-btn" id="confirm-delivery-scheduled-btn">Confirm Delivery Scheduled</button>'
      + '</div>';
  }

  function wireScheduleDeliveryForm() {
    var btn = document.getElementById('confirm-delivery-scheduled-btn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var deliveryServiceType = document.getElementById('delivery-service-select').value;
      var deliveryTimeSlot = document.getElementById('delivery-time-select').value;
      btn.disabled = true;
      opsCall('gearCheckout_scheduleDelivery', { bookingId: currentBookingId, deliveryServiceType: deliveryServiceType, deliveryTimeSlot: deliveryTimeSlot }).then(function (result) {
        btn.disabled = false;
        if (!result.ok) { showBanner('error', (result.data && result.data.error) || 'Could not schedule delivery.'); return; }
        showBanner('success', 'Delivery scheduled for #' + currentBookingId + '.');
        loadDetail();
      });
    });
  }

  function markReadyForDelivery() {
    opsCall('gearCheckout_markReadyForDelivery', { bookingId: currentBookingId }).then(function (result) {
      if (!result.ok) { showBanner('error', (result.data && result.data.error) || 'Could not mark ready for delivery.'); return; }
      showBanner('success', 'Marked ready for delivery for #' + currentBookingId + '.');
      loadDetail();
    });
  }

  function markDeliveredFinal() {
    opsCall('gearCheckout_markDeliveredFinal', { bookingId: currentBookingId, deliveredBy: document.getElementById('user-email').textContent }).then(function (result) {
      if (!result.ok) { showBanner('error', (result.data && result.data.error) || 'Could not mark delivered.'); return; }
      showBanner('success', 'Gear marked delivered for #' + currentBookingId + '.');
      loadDetail();
    });
  }

  // -------------------- Shell --------------------

  function onReady() {
    var today = new Date();
    var tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
    document.getElementById('queue-trip-date').value = tomorrow.toISOString().slice(0, 10);
    document.getElementById('queue-trip-date').addEventListener('change', loadQueue);
    document.getElementById('back-to-queue').addEventListener('click', function () {
      stopScan();
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('queue-view').classList.remove('hidden');
      loadQueue();
    });
    loadQueue();
  }

  OpsShell.boot({
    activeHref: 'ops-gear-checkout.html',
    title: 'Gear Assembly & Checkout',
    subtitle: 'T-1 checkout queue — every active booking whose trail day is the selected date.',
    onReady: onReady,
  });
})();
</script>
</body>
</html>
