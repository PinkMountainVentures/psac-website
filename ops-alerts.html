<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Alerts | PSAC Ops</title>
<!--
  ops-alerts.html

  Expanded per Phase 4, Round 1 of claude/psac-ops-ux-journey-map-phases-1-3.md
  — "the firefighting center." Wired to /api/ops-proxy's new
  listOpsAlertsExpanded action (apps-script/ops-redesign-round1-actions.gs's
  opsAlerts_listExpanded), which merges the existing sheet-backed payment/
  hold-failure family with five new LIVE-COMPUTED producers (Reconciliation
  required, Manual-adjustment short-allocation, Stalled call-today, Gear
  low-stock, Cancellation FYI). None of those five are written as Ops Alerts
  sheet rows — they're computed fresh on every load, so there is nothing to
  "resolve" for them except gear low-stock, which auto-clears, and the
  existing Resolve action still only applies to the original payment/hold-
  failure family.

  CUSTOM TIER REQUESTS ARE NOT BUILT. No intake mechanism exists anywhere in
  this codebase (confirmed via exhaustive grep across api/, lib/, apps-
  script/, and every ops-*.html — zero matches for "custom tier"). Per this
  build's explicit instruction, this is flagged as a real blocker below
  (Standard tier), not silently stubbed with fake data.
-->
<link rel="stylesheet" href="ops-shell.css">
<style>
  .ops-app { max-width:1200px; }
  .critical-banner { display:flex; align-items:center; gap:0.7rem; background:var(--sunset-red); color:white; border-radius:8px; padding:0.9rem 1.2rem; margin-bottom:1.2rem; font-size:0.9rem; font-weight:700; }
  .critical-banner-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; }
  .critical-banner-row + .critical-banner-row { margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid rgba(255,255,255,0.3); }

  .category-bar { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1.1rem; }
  .cat-chip { border:1px solid var(--ops-border); background:white; border-radius:16px; padding:0.35rem 0.8rem; font-size:0.76rem; cursor:pointer; color:var(--ops-text); }
  .cat-chip.is-active { background:var(--dark-pine); color:white; border-color:var(--dark-pine); }

  .tier-section { margin-bottom:1.6rem; }
  .tier-heading { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); margin-bottom:0.5rem; }
  .tier-section.awareness { opacity:0.85; }
  .tier-section.awareness .tier-heading { color:var(--ops-text-mid); }

  .ops-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .ops-table th { text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); padding:0.6rem 0.8rem; border-bottom:2px solid var(--ops-border); }
  .ops-table td { padding:0.7rem 0.8rem; border-bottom:1px solid var(--ops-border); vertical-align:middle; }
  .ops-table tr:hover td { background:#FAFBFB; }
  .tier-section.awareness .ops-table td { color:var(--ops-text-mid); }

  .ops-tag { display:inline-block; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:0.22rem 0.55rem; border-radius:4px; }
  .ops-tag.callnow { background:var(--sunset-red); color:white; }
  .ops-tag.urgent { background:#FFF3D6; color:#8a6300; }
  .ops-tag.standard, .ops-tag.awareness-tag { background:#E7ECEE; color:#3E4A50; }
  .ops-tag.open { background:rgba(245,130,113,0.15); color:#b04a2a; }
  .ops-tag.resolved { background:rgba(122,189,145,0.18); color:#2a7a4a; }
  .ops-tag.responded { background:#FFF3D6; color:#8a6300; }

  .resolve-panel { border:1px solid var(--ops-border); border-radius:8px; padding:1.2rem 1.4rem; margin-top:1rem; }
  .resolve-panel textarea { width:100%; min-height:56px; border:1px solid var(--ops-border); border-radius:5px; padding:0.6rem 0.8rem; font-size:0.82rem; font-family:inherit; margin-top:0.6rem; }
  .resolve-panel-footer { display:flex; justify-content:flex-end; gap:0.6rem; margin-top:0.8rem; }
  /* NEW (Phase 2.5 Trail Day, 2026-09-04): the gear-issue Resolve panel's
     quoted guest message -- same job as a payment alert's own detail
     text, just with a real guest quote worth reading before resolving. */
  .resolve-quote { background:#FCFCFB; border:1px solid var(--ops-border); border-left:3px solid var(--mountain-pink); border-radius:0 6px 6px 0; padding:0.7rem 0.9rem; font-size:0.82rem; color:var(--ops-text); margin-top:0.8rem; line-height:1.55; }
  .resolve-meta { font-size:0.74rem; color:var(--ops-text-mid); margin-top:0.5rem; display:flex; gap:1.2rem; flex-wrap:wrap; }

  .blocked-note { background:#FFF9EC; border:1.5px solid #E9CB7A; padding:0.9rem 1.1rem; font-size:0.8rem; color:#6b4e00; line-height:1.6; border-radius:6px; }
</style>
</head>
<body>

<div id="loading-gate">Checking sign-in…</div>

<div id="app-shell" class="hidden">
  <div class="ops-app">
    <div class="ops-sidebar" id="ops-sidebar"></div>
    <div class="ops-main">
      <div class="ops-topbar">
        <div class="ops-title" id="ops-title"></div>
        <div class="ops-user"><span id="user-email"></span><button class="ops-signout" id="signout-btn">Sign out</button></div>
      </div>
      <div class="ops-subtitle" id="ops-subtitle"></div>
      <div id="ops-search-container"></div>

      <div id="error-banner" class="ops-error-banner hidden"></div>
      <div id="banner-container"></div>

      <div class="category-bar" id="category-bar"></div>

      <div id="tiers-container"></div>
      <div id="resolve-container"></div>
    </div>
  </div>
</div>

<script src="ops-shell.js"></script>
<script>
(function () {
  'use strict';
  var escapeHtml = OpsShell.escapeHtml;
  var activeCategory = 'All';
  var allData = null;
  // NEW (Phase 2.5 Trail Day, 2026-09-04): openResolvePanel only ever got
  // an alertId before (data-resolve-alert), enough for the plain payment/
  // hold-failure Resolve panel -- a gear-issue row needs the rest of the
  // row (the guest's quoted message, reporter name/email) to show
  // something worth reading before resolving. Populated at render() time.
  var rowsById = {};
  // BUG FIX (Aug 2026): see OpsShell.normalizeBookingIdInput's own comment
  // — defense in depth here too, in case this ever gets a '#'-prefixed
  // value (e.g. a hand-built/bookmarked URL).
  var filterBookingId = OpsShell.normalizeBookingIdInput(new URLSearchParams(window.location.search).get('bookingId') || '');

  var CATEGORIES = ['All', 'Payment & Hold', 'Bookings & Cancellations', 'Reconciliation', 'Manual Adjustment', 'Custom Tier', 'Gear'];
  var CATEGORY_BY_SOURCE = {
    payment_hold_failure: 'Payment & Hold',
    stalled_call_today: 'Bookings & Cancellations',
    cancellation_fyi: 'Bookings & Cancellations',
    reconciliation_required: 'Reconciliation',
    manual_adjustment_short_allocation: 'Manual Adjustment',
    gear_low_stock: 'Gear',
    // NEW (Phase 2.5 Trail Day, 2026-09-04): gear-issue reports from the
    // trail-day "Something not right?" escape hatch. Same Gear category
    // as gear_low_stock, but resolvable like the payment/hold-failure
    // family -- see lib/gear-issue-service.js and lib/all-bookings-
    // service.js's listOpsAlertsExpanded for the read/write side.
    gear_issue: 'Gear',
  };

  // First-pass human-readable labels for the payment/hold-failure family's
  // raw alertType strings — Phase 4 Round 1's own named 9, plus a handful
  // more this same family has grown to include (confirmed via grep across
  // api/, lib/, apps-script/ — ~30 distinct alertType literals total, not
  // exactly the "28" this build's kickoff prompt assumed). Anything not
  // named here falls back to a humanized version of the raw string rather
  // than breaking — this whole map is a first pass, worth Airey's review,
  // same caveat the written spec itself carries.
  var ALERT_TYPE_LABELS = {
    kit_charge_failed: 'Kit charge failed',
    deposit_hold_failed: 'Gear deposit hold failed',
    gear_reconciliation_trigger_failed: "Reconciliation didn't trigger",
    save_booking_failed_unrecovered: 'Booking save failed',
    deposit_hold_trigger_error: 'Hold-trigger error',
    hold_renewal_old_hold_cancel_failed: "Old hold didn't cancel on renewal",
    cancel_refund_declined: 'Refund declined on cancellation',
    cancellation_gate_call_failed: "Cancellation didn't complete",
    kit_count_correction_hold_resize_failed: 'Hold resize failed (kit correction)',
  };
  function alertTypeLabel(alertType) {
    if (ALERT_TYPE_LABELS[alertType]) return ALERT_TYPE_LABELS[alertType];
    return String(alertType || '').replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
  }

  function formatMoney(amount) {
    if (amount === '' || amount == null) return '—';
    var n = Number(amount);
    if (isNaN(n)) return escapeHtml(amount);
    return '$' + n.toFixed(2);
  }

  function showError(message) {
    var el = document.getElementById('error-banner');
    el.textContent = message;
    el.classList.remove('hidden');
  }

  function passesFilter(row) {
    if (filterBookingId && String(row.bookingId) !== String(filterBookingId)) return false;
    if (activeCategory === 'All') return true;
    return CATEGORY_BY_SOURCE[row.source] === activeCategory;
  }

  function renderBanner(critical) {
    var container = document.getElementById('banner-container');
    if (!critical.length) { container.innerHTML = ''; return; }
    container.innerHTML = '<div class="critical-banner">' + critical.map(function (a) {
      return '<div class="critical-banner-row"><span>&#9888; #' + escapeHtml(a.bookingId) + ' — ' + escapeHtml(alertTypeLabel(a.alertType))
        + (a.amount ? ', ' + formatMoney(a.amount) : '') + '. Act today.</span></div>';
    }).join('') + '</div>';
  }

  function actionCell(row) {
    if (row.source === 'payment_hold_failure' || row.source === 'gear_issue') {
      if (row.status === 'Resolved') {
        return '<span style="color:var(--ops-text-mid); font-size:0.76rem;">' + escapeHtml(row.resolvedBy || '') + (row.resolvedAt ? (' — ' + escapeHtml(String(row.resolvedAt).slice(0, 10))) : '') + '</span>';
      }
      // Gear issues get "Review & Resolve" (there's a guest message worth
      // reading first) -- payment/hold-failure alerts keep the plain
      // "Resolve" label they've always had. Same button, same handler,
      // same resolveOpsAlert action either way -- resolveAlert() (lib/
      // hold-clearance-service.js) updates by alert_id alone, no source
      // check, so nothing server-side needed to support this.
      var label = row.source === 'gear_issue' ? 'Review & Resolve' : 'Resolve';
      return '<button class="ops-btn-secondary" data-resolve-alert="' + escapeHtml(row.alertId) + '">' + label + '</button>';
    }
    if (row.source === 'stalled_call_today') return '<a class="ops-link" href="ops-stalled-bookings.html?bookingId=' + encodeURIComponent(row.bookingId) + '">Call script &rarr;</a>';
    if (row.source === 'reconciliation_required') return '<a class="ops-link" href="ops-reconciliation-review.html?bookingId=' + encodeURIComponent(row.bookingId) + '">Review &rarr;</a>';
    if (row.source === 'manual_adjustment_short_allocation') return '<a class="ops-link" href="ops-gear-checkout.html?bookingId=' + encodeURIComponent(row.bookingId) + '">Retry Allocation &rarr;</a>';
    if (row.source === 'gear_low_stock') return '<a class="ops-link" href="ops-gear-units.html?itemType=' + encodeURIComponent(row.itemType) + '">View Inventory &rarr;</a>';
    if (row.source === 'cancellation_fyi') return '<a class="ops-link" href="ops-cancellations.html?bookingId=' + encodeURIComponent(row.bookingId) + '">View &rarr;</a>';
    return '';
  }

  function statusTag(row) {
    if (row.source === 'payment_hold_failure' || row.source === 'gear_issue') return row.status === 'Resolved' ? '<span class="ops-tag resolved">Resolved</span>' : '<span class="ops-tag open">Open</span>';
    if (row.source === 'gear_low_stock') return '<span class="ops-tag standard">Live — auto-clears</span>';
    return '<span class="ops-tag open">Open</span>';
  }

  function rowHtml(row) {
    var desc = row.source === 'payment_hold_failure' ? alertTypeLabel(row.alertType) : row.description;
    var bookingCell = row.bookingId ? ('#' + escapeHtml(row.bookingId)) : '<span style="color:var(--ops-text-mid);">' + escapeHtml(desc) + (row.availableCount != null ? (' (' + row.availableCount + ' available)') : '') + '</span>';
    return '<tr>'
      + '<td>' + bookingCell + '</td>'
      + '<td>' + escapeHtml(desc) + '</td>'
      + '<td>' + formatMoney(row.amount) + '</td>'
      + '<td>' + escapeHtml(String(row.createdAt || '').slice(0, 10)) + '</td>'
      + '<td>' + statusTag(row) + '</td>'
      + '<td>' + actionCell(row) + '</td>'
      + '</tr>';
  }

  function tierTable(rows) {
    if (!rows.length) return '<div class="ops-empty">Nothing in this tier right now.</div>';
    return '<table class="ops-table"><thead><tr><th>Booking</th><th>Alert</th><th>Amount</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody>'
      + rows.map(rowHtml).join('') + '</tbody></table>';
  }

  function render(data) {
    var payment = data.paymentHoldFailure.filter(passesFilter);
    var critical = payment.filter(function (a) { return a.urgencyTier === 'critical' && a.status === 'Open'; });
    renderBanner(critical);

    var urgent = []
      .concat(payment.filter(function (a) { return a.urgencyTier !== 'critical'; }))
      .concat(data.reconciliationRequired.filter(passesFilter))
      .concat(data.shortAllocation.filter(passesFilter))
      .concat(data.stalledCallToday.filter(passesFilter))
      .concat(data.gearLowStock.filter(passesFilter));
    urgent.sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
    urgent.forEach(function (row) { if (row.alertId) rowsById[row.alertId] = row; });

    var awareness = data.cancellationsFyi.filter(passesFilter);

    var html = '';
    html += '<div class="tier-section"><div class="tier-heading">Urgent</div>' + tierTable(urgent) + '</div>';

    if (activeCategory === 'All' || activeCategory === 'Custom Tier') {
      html += '<div class="tier-section"><div class="tier-heading">Standard — Custom Tier requests</div>'
        + '<div class="blocked-note"><strong>Not built this round.</strong> Custom Tier Experience requests exit the booking flow entirely as an off-system email inquiry today — there is no intake mechanism anywhere in this codebase for them to land in this app at all (confirmed by an exhaustive search across every API endpoint, library, Apps Script file, and ops page). Building the two-step Open/Responded/Handled status this page eventually needs requires that intake to exist first — a different system\'s build, flagged here rather than stubbed with fake rows.</div></div>';
    }

    html += '<div class="tier-section awareness"><div class="tier-heading">For your awareness — Cancellations</div>' + tierTable(awareness) + '</div>';

    document.getElementById('tiers-container').innerHTML = html;
    document.getElementById('tiers-container').querySelectorAll('[data-resolve-alert]').forEach(function (btn) {
      btn.addEventListener('click', function () { openResolvePanel(btn.getAttribute('data-resolve-alert')); });
    });
  }

  function openResolvePanel(alertId) {
    var row = rowsById[alertId];
    var isGearIssue = row && row.source === 'gear_issue';
    var container = document.getElementById('resolve-container');
    container.innerHTML = '<div class="resolve-panel">'
      // GENERALIZED (Phase 3 Post-Adventure, 2026-09-05): was a hardcoded
      // "Gear issue" label -- now reads the row's own description so a
      // return-note alert reads correctly here too (see lib/all-bookings-
      // service.js's listOpsAlertsExpanded for where that description is set).
      + '<strong>' + (isGearIssue ? 'Resolve — ' + escapeHtml(row.description || 'Gear issue') + ', #' + escapeHtml(row.bookingId || '') : 'Resolve — #' + escapeHtml(alertId)) + '</strong>'
      + '<div style="font-size:0.8rem; color:var(--ops-text-mid); margin-top:0.4rem;">'
      + (isGearIssue
        ? 'Confirm the guest\'s actually taken care of before resolving — this doesn\'t dispatch anything on its own, it only records that it\'s been handled.'
        : 'Confirm the underlying issue is actually fixed before resolving — this does not retry any charge or hold itself, it only records that it\'s been handled.')
      + '</div>'
      + (isGearIssue
        ? '<div class="resolve-quote">&ldquo;' + escapeHtml(row.guestMessage || '') + '&rdquo;</div>'
          + '<div class="resolve-meta">'
          + (row.guestName ? '<span>Reported by ' + escapeHtml(row.guestName) + '</span>' : '')
          + (row.guestEmail ? '<span>Reply-to: ' + escapeHtml(row.guestEmail) + '</span>' : '')
          + '<span>Sent to reservations@ &middot; ' + escapeHtml(String(row.createdAt || '').slice(0, 16).replace('T', ' ')) + '</span>'
          + '</div>'
        : '')
      + '<textarea id="resolve-notes" placeholder="Notes (optional)' + (isGearIssue ? ' — e.g. how it was handled' : '') + '"></textarea>'
      + '<div class="resolve-panel-footer">'
      + '<button class="ops-btn-secondary" id="resolve-cancel">Cancel</button>'
      + '<button class="ops-btn" id="resolve-confirm">Mark Resolved</button>'
      + '</div></div>';

    // BUG FIX (coordinating chat, 2026-09-02, live-verification pass):
    // #resolve-container sits below #tiers-container, which on a page with
    // any real number of alerts runs well past one screen. Nothing here
    // ever scrolled the newly-filled panel into view, so clicking Resolve
    // on any row that wasn't already near the bottom of the page silently
    // rendered a fully-functional panel off-screen — reported live as "the
    // Resolve buttons don't do anything."
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.getElementById('resolve-cancel').addEventListener('click', function () { container.innerHTML = ''; });
    document.getElementById('resolve-confirm').addEventListener('click', function () {
      var notes = document.getElementById('resolve-notes').value;
      OpsShell.opsCall('resolveOpsAlert', { alertId: alertId, notes: notes }).then(function (result) {
        if (!result.ok) { showError('Could not resolve that alert. Please try again.'); return; }
        container.innerHTML = '';
        loadAlerts();
      });
    });
  }

  function renderCategoryBar() {
    document.getElementById('category-bar').innerHTML = CATEGORIES.map(function (c) {
      return '<button class="cat-chip' + (c === activeCategory ? ' is-active' : '') + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
    }).join('');
    document.querySelectorAll('[data-cat]').forEach(function (btn) {
      btn.addEventListener('click', function () { activeCategory = btn.getAttribute('data-cat'); renderCategoryBar(); if (allData) render(allData); });
    });
  }

  function loadAlerts() {
    var container = document.getElementById('tiers-container');
    OpsShell.withLoadingState(container, function () {
      return OpsShell.opsCall('listOpsAlertsExpanded', {}).then(function (result) {
        if (!result.ok) { showError('Could not load Ops Alerts.'); throw new Error('load failed'); }
        allData = result.data;
        render(allData);
      });
    });
  }

  renderCategoryBar();

  OpsShell.boot({
    activeHref: 'ops-alerts.html',
    title: 'Ops Alerts',
    subtitle: 'Everything that needs a human right now, across the business.',
    onReady: function () { loadAlerts(); },
  });
})();
</script>
</body>
</html>
