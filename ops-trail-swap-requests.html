<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Swap Requests | PSAC Ops</title>
<!--
  ops-trail-swap-requests.html

  Real, working version of claude/psac-ops-trail-swap-requests.html's
  mockup (all three states: queue list, clean-pick review, override-
  required review) — wired to /api/ops-proxy, which holds
  TRAIL_OVERRIDE_SHARED_SECRET server-side and reuses api/write-manual-
  trail-override.js's own validation (mandatory reason when overriding a
  Tier A check, etc.) rather than re-implementing it here.

  Round 2 (Aug 2026): retrofitted to the shared OpsShell (ops-shell.js/.css)
  — this page previously carried its own inline sidebar/topbar/loading
  boilerplate, unaware of the redesign's other new pages (All Bookings,
  Ops Alerts, Stalled Bookings, Cancellations). No functional change to
  the trail-swap review flow itself.
-->
<link rel="stylesheet" href="ops-shell.css">
<style>
  .ops-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .ops-table th { text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); padding:0.6rem 0.8rem; border-bottom:2px solid var(--ops-border); }
  .ops-table td { padding:0.7rem 0.8rem; border-bottom:1px solid var(--ops-border); vertical-align:middle; }
  .ops-table tr:hover td { background:#FAFBFB; }

  .ops-tag { display:inline-block; font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:0.22rem 0.55rem; border-radius:4px; }
  .ops-tag.staff { background:#E7ECEE; color:#3E4A50; }
  .ops-tag.system { background:#FDECE0; color:#9A5B1E; }
  .ops-tag.open { background:rgba(245,130,113,0.15); color:#b04a2a; }
  .ops-tag.resolved { background:rgba(122,189,145,0.18); color:#2a7a4a; }

  .ops-btn { background:var(--dark-pine); color:white; border:none; border-radius:5px; padding:0.55rem 0.9rem; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .ops-btn:hover { background:#1e3535; }
  .ops-btn:disabled { opacity:0.4; cursor:default; }
  .ops-btn-secondary { background:white; border:1px solid var(--ops-border); color:var(--ops-text); border-radius:5px; padding:0.5rem 0.9rem; font-size:0.78rem; cursor:pointer; }
  .ops-link { color:#2A6F97; text-decoration:none; font-size:0.8rem; cursor:pointer; background:none; border:none; }

  .ops-panel { border:1px solid var(--ops-border); border-radius:8px; padding:1.4rem 1.6rem; margin-top:1rem; }
  .ops-panel-title { font-size:0.95rem; font-weight:700; margin-bottom:0.9rem; color:var(--dark-pine); }
  .ops-select, .ops-input { width:100%; padding:0.65rem 0.8rem; border:1px solid var(--ops-border); border-radius:5px; font-size:0.85rem; color:var(--ops-text); background:white; margin-bottom:0.9rem; }
  .ops-check-row { display:flex; align-items:center; justify-content:space-between; padding:0.55rem 0.8rem; background:var(--ops-bg); border-radius:5px; margin-bottom:0.4rem; font-size:0.78rem; }
  .ops-check-pass { color:#2a7a4a; font-weight:600; }
  .ops-check-fail { color:#a8341c; font-weight:600; }
  .ops-warning-box { background:rgba(231,111,81,0.1); border:1px solid rgba(231,111,81,0.35); border-radius:6px; padding:0.9rem 1rem; margin:0.9rem 0; font-size:0.82rem; color:#7a2c1a; }
  .ops-textarea { width:100%; border:1px solid var(--ops-border); border-radius:5px; padding:0.65rem 0.8rem; font-size:0.82rem; font-family:inherit; min-height:64px; }
  .ops-form-row { margin-bottom:0.9rem; }
  .ops-form-row label { display:block; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ops-text-mid); margin-bottom:0.35rem; }
  .ops-panel-footer { display:flex; justify-content:flex-end; gap:0.6rem; margin-top:1rem; }
</style>
</head>
<body>

<div id="loading-gate">Checking sign-in…</div>

<div id="app-shell" class="hidden">
  <div class="ops-app">
    <div class="ops-sidebar" id="ops-sidebar"></div>
    <div class="ops-main">
      <div class="ops-topbar">
        <div>
          <div class="ops-title" id="ops-title"></div>
          <div class="ops-subtitle" id="ops-subtitle"></div>
        </div>
        <div class="ops-user"><span id="user-email"></span><button class="ops-signout" id="signout-btn">Sign out</button></div>
      </div>
      <div id="ops-search-container"></div>
      <div id="error-banner" class="ops-error-banner hidden"></div>
      <div id="queue-view"></div>
      <div id="review-view"></div>
    </div>
  </div>
</div>

<script src="ops-shell.js"></script>
<script>
(function () {
  'use strict';
  var currentUserEmail = '';

  var opsCall = OpsShell.opsCall;
  var escapeHtml = OpsShell.escapeHtml;

  function showError(message) {
    var el = document.getElementById('error-banner');
    el.textContent = message;
    el.classList.remove('hidden');
  }

  var FILTER_LABELS = {
    seasonal_safety: 'Seasonal safety',
    family_tier: 'Family-tier eligibility',
    difficulty_ceiling: 'Difficulty ceiling',
    technical_ceiling: 'Technical ceiling',
  };

  function renderQueue(requests) {
    document.getElementById('review-view').innerHTML = '';
    var container = document.getElementById('queue-view');
    if (!requests.length) {
      container.innerHTML = '<div class="ops-empty">No trail swap requests on record yet.</div>';
      return;
    }
    var rows = requests.map(function (r) {
      var isSystem = String(r.guestConcernSummary || '').indexOf('system-generated:') === 0;
      var sourceTag = isSystem ? '<span class="ops-tag system">System-flagged</span>' : '<span class="ops-tag staff">Staff-reported</span>';
      var statusTag = r.status === 'Resolved' ? '<span class="ops-tag resolved">Resolved</span>' : '<span class="ops-tag open">Open</span>';
      var actionLabel = r.status === 'Resolved' ? 'View' : 'Review';
      return '<tr>'
        + '<td>#' + escapeHtml(r.bookingId) + '</td>'
        + '<td>' + sourceTag + '</td>'
        + '<td>' + escapeHtml(r.guestConcernSummary || '') + '</td>'
        + '<td>' + escapeHtml(r.receivedAt || '') + '</td>'
        + '<td>' + statusTag + '</td>'
        + '<td><button class="ops-link" data-review="' + escapeHtml(r.swapRequestId) + '" data-booking="' + escapeHtml(r.bookingId) + '">' + actionLabel + ' →</button></td>'
        + '</tr>';
    }).join('');
    container.innerHTML = '<table class="ops-table"><thead><tr><th>Booking</th><th>Source</th><th>Concern / flag</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';

    container.querySelectorAll('[data-review]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openReview(btn.getAttribute('data-review'), btn.getAttribute('data-booking'));
      });
    });
  }

  function loadQueue() {
    OpsShell.withLoadingState(document.getElementById('queue-view'), function () {
      return opsCall('listTrailSwapRequests', {}).then(function (result) {
        if (!result.ok) { showError('Could not load Trail Swap Requests.'); return; }
        renderQueue(result.data.requests || []);
      });
    });
  }

  function renderChecklist(failedFilters, ceilingsEvaluatable) {
    var allFilters = ['difficulty_ceiling', 'technical_ceiling', 'family_tier', 'seasonal_safety'];
    return allFilters.map(function (f) {
      var isCeiling = f === 'difficulty_ceiling' || f === 'technical_ceiling';
      if (isCeiling && ceilingsEvaluatable === false) {
        return '<div class="ops-check-row"><span>' + FILTER_LABELS[f] + '</span><span style="color:var(--ops-text-mid);">— not evaluated, use judgment</span></div>';
      }
      var failed = failedFilters.indexOf(f) !== -1;
      return '<div class="ops-check-row"><span>' + FILTER_LABELS[f] + '</span><span class="' + (failed ? 'ops-check-fail' : 'ops-check-pass') + '">' + (failed ? '✗ Fails' : '✓ Clears') + '</span></div>';
    }).join('');
  }

  function openReview(swapRequestId, bookingId) {
    document.getElementById('ops-title').textContent = 'Trail Swap Requests / #' + bookingId;
    var reviewView = document.getElementById('review-view');
    reviewView.innerHTML = '<div class="ops-empty">Loading trail options…</div>';

    opsCall('getTrailSwapDropdownOptions', { bookingId: bookingId }).then(function (result) {
      if (!result.ok || result.data.notFound) {
        reviewView.innerHTML = '';
        showError('Could not load trail options for that booking.');
        return;
      }
      var options = result.data.options || [];
      var ceilingsEvaluatable = result.data.ceilingsEvaluatable;

      if (!options.length) {
        reviewView.innerHTML = '<div class="ops-panel"><div class="ops-panel-title">No bookable trails available for this booking\'s date/park.</div>'
          + '<button class="ops-btn-secondary" id="review-back">Back to queue</button></div>';
        document.getElementById('review-back').addEventListener('click', function () { reviewView.innerHTML = ''; document.getElementById('ops-title').textContent = 'Trail Swap Requests'; });
        return;
      }

      function renderPanel(selectedIdx) {
        var selected = options[selectedIdx];
        var hasFailures = selected.failedFilters && selected.failedFilters.length > 0;
        reviewView.innerHTML = '<div class="ops-panel" style="' + (hasFailures ? 'border-color:rgba(231,111,81,0.4);' : '') + '">'
          + '<div class="ops-panel-title">Pick a new trail</div>'
          + '<select class="ops-select" id="trail-select">'
          + options.map(function (o, i) { return '<option value="' + i + '"' + (i === selectedIdx ? ' selected' : '') + '>' + escapeHtml(o.trailName) + (o.difficultyRating ? ' (Difficulty ' + o.difficultyRating + '/5)' : '') + '</option>'; }).join('')
          + '</select>'
          + (selected.difficultyRating ? '<div class="ops-check-row"><span>Difficulty rating</span><span>' + selected.difficultyRating + ' / 5</span></div>' : '')
          + renderChecklist(selected.failedFilters || [], ceilingsEvaluatable)
          + (hasFailures ? (
              '<div class="ops-warning-box"><strong>⚠ This selection overrides a Tier A safety filter.</strong>'
              + '<ul>' + selected.failedFilters.map(function (f) { return '<li>' + FILTER_LABELS[f] + ' failed for this trail.</li>'; }).join('') + '</ul>'
              + 'A reason is required before this can be applied.</div>'
            ) : '')
          + '<div class="ops-form-row"><label>Staff notes (optional)</label><textarea class="ops-textarea" id="staff-notes"></textarea></div>'
          + (hasFailures ? '<div class="ops-form-row"><label>Safety override reason (required)</label><textarea class="ops-textarea" id="override-reason" style="border-color:#e0a08f;"></textarea></div>' : '')
          + '<label style="display:flex; align-items:center; gap:0.4rem; font-size:0.78rem; margin-bottom:0.6rem;"><input type="checkbox" id="skip-email"> Skip guest notification email</label>'
          + '<div class="ops-panel-footer">'
          + '<button class="ops-btn-secondary" id="review-cancel">Cancel</button>'
          + '<button class="ops-btn" id="review-apply">Apply</button>'
          + '</div></div>';

        document.getElementById('trail-select').addEventListener('change', function (e) { renderPanel(Number(e.target.value)); });
        document.getElementById('review-cancel').addEventListener('click', function () {
          reviewView.innerHTML = '';
          document.getElementById('ops-title').textContent = 'Trail Swap Requests';
        });
        document.getElementById('review-apply').addEventListener('click', function () {
          var reasonEl = document.getElementById('override-reason');
          var reason = reasonEl ? reasonEl.value.trim() : '';
          if (hasFailures && !reason) {
            showError('A safety override reason is required for this selection.');
            return;
          }
          opsCall('applyTrailSwapOverride', {
            bookingId: bookingId,
            swapRequestId: swapRequestId,
            newTrailId: selected.trailId,
            newTrailName: selected.trailName,
            difficultyRating: selected.difficultyRating,
            staffNotes: document.getElementById('staff-notes').value,
            tierASafetyFiltersOverridden: hasFailures ? selected.failedFilters : [],
            safetyOverrideReason: reason,
            skipGuestEmail: document.getElementById('skip-email').checked,
            reviewedBy: currentUserEmail,
          }).then(function (applyResult) {
            if (!applyResult.ok) {
              showError((applyResult.data && applyResult.data.detail) || 'Could not apply that trail change.');
              return;
            }
            reviewView.innerHTML = '';
            document.getElementById('ops-title').textContent = 'Trail Swap Requests';
            loadQueue();
          });
        });
      }

      renderPanel(0);
    });
  }

  OpsShell.boot({
    activeHref: 'ops-trail-swap-requests.html',
    title: 'Trail Swap Requests',
    subtitle: 'Staff-reported and system-flagged trail concerns awaiting a swap decision.',
    onReady: function (email) {
      currentUserEmail = email;
      loadQueue();
    },
  });
})();
</script>
</body>
</html>
