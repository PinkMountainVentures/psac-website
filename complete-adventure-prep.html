<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finish setting up your adventure | Palm Springs Adventure Club</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ap-styles.css">
</head>
<body>

<header class="ap-header">
  <div class="container">
    <a href="/" class="ap-logo"><img src="/images/logo.svg" alt="Palm Springs Adventure Club"></a>
    <button type="button" id="ap-help-btn" class="ap-help-btn">Questions?</button>
  </div>
</header>
<div id="ap-help-panel" class="help-panel">
  <div class="help-panel-inner">
    <div class="help-panel-label">Questions? Ask us anything</div>
    <textarea id="ap-help-textarea" class="help-textarea" placeholder="What do you need help with?"></textarea>
    <div class="help-row">
      <div class="help-note">We'll reply to the email on your booking.</div>
      <button type="button" id="ap-help-send" class="help-send">Send</button>
    </div>
  </div>
</div>

<main id="ap-root" class="ap-shell">
  <div class="container">
    <div class="ap-card" style="text-align:center; padding:3rem 2rem;">
      <div class="transition-spinner" style="margin-bottom:1.4rem;"></div>
      <p class="ap-sub" style="margin:0 auto;">Loading your adventure&hellip;</p>
    </div>
  </div>
</main>

<script>
(function () {
  var btn = document.getElementById('ap-help-btn');
  var panel = document.getElementById('ap-help-panel');
  var sendBtn = document.getElementById('ap-help-send');
  var textarea = document.getElementById('ap-help-textarea');
  if (!btn || !panel) return;
  btn.addEventListener('click', function () {
    var isOpen = panel.classList.toggle('is-open');
    btn.textContent = isOpen ? 'Close \u2715' : 'Questions?';
    if (isOpen && textarea) textarea.focus();
  });
  if (sendBtn && textarea) {
    // PROVISIONAL (coordinating chat, 2026-09-02): no dedicated
    // send-a-message backend exists yet (checked -- nothing under api/
    // handles a support/contact/help action today), so this hands off to
    // a pre-filled mailto rather than silently doing nothing. Flagged to
    // Airey as a real upgrade decision, not a permanent design.
    sendBtn.addEventListener('click', function () {
      var body = textarea.value.trim();
      if (!body) { textarea.focus(); return; }
      var subject = 'Question from your Adventure Prep page';
      window.location.href = 'mailto:hello@palmspringsadventureclub.com'
        + '?subject=' + encodeURIComponent(subject)
        + '&body=' + encodeURIComponent(body);
    });
  }
})();
</script>
<script src="/adventure-prep-form.js"></script>
</body>
</html>
