<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finish setting up your adventure | Palm Springs Adventure Club</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ap-styles.css">
</head>
<body>

<header class="ap-header">
  <div class="container">
    <a href="/" class="ap-logo"><img src="/images/logo.svg" alt="Palm Springs Adventure Club"></a>
    <button type="button" id="ap-help-btn" class="ap-help-btn">Questions?</button>
  </div>
</header>
<div id="ap-help-panel" class="help-panel">
  <div class="help-panel-inner">
    <div class="help-panel-label">Questions? Ask us anything</div>
    <textarea id="ap-help-textarea" class="help-textarea" placeholder="What do you need help with?"></textarea>
    <div class="help-row">
      <div class="help-note">We'll reply to the email on your booking.</div>
      <button type="button" id="ap-help-send" class="help-send">Send</button>
    </div>
  </div>
</div>

<main id="ap-root" class="ap-shell">
  <div class="container">
    <div class="ap-card" style="text-align:center; padding:3rem 2rem;">
      <div class="transition-spinner" style="margin-bottom:1.4rem;"></div>
      <p class="ap-sub" style="margin:0 auto;">Loading your adventure&hellip;</p>
    </div>
  </div>
</main>

<script>
(function () {
  var btn = document.getElementById('ap-help-btn');
  var panel = document.getElementById('ap-help-panel');
  var sendBtn = document.getElementById('ap-help-send');
  var textarea = document.getElementById('ap-help-textarea');
  if (!btn || !panel) return;
  btn.addEventListener('click', function () {
    var isOpen = panel.classList.toggle('is-open');
    btn.textContent = isOpen ? 'Close \u2715' : 'Questions?';
    if (isOpen && textarea) textarea.focus();
  });
  if (sendBtn && textarea) {
    // Sends via Resend (api/send-help-message.js) so the interaction lands
    // as a real email in the reservations@ inbox, reply-to set to the
    // guest's own address -- replaces the earlier mailto: placeholder.
    var statusEl = null;
    function setStatus(text, isError) {
      if (!statusEl) {
        statusEl = document.createElement('div');
        statusEl.className = isError ? 'ap-error' : 'help-sent-note';
        var row = sendBtn.closest('.help-row');
        if (row && row.parentNode) row.parentNode.insertBefore(statusEl, row.nextSibling);
      }
      statusEl.className = isError ? 'ap-error' : 'help-sent-note';
      statusEl.textContent = text;
    }
    sendBtn.addEventListener('click', function () {
      var message = textarea.value.trim();
      if (!message) { textarea.focus(); return; }
      var token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        setStatus('Something went wrong loading this page -- refresh and try again.', true);
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      fetch('/api/send-help-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, message: message })
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send';
          if (result.ok && result.data && result.data.status === 'sent') {
            textarea.value = '';
            setStatus('Sent -- we’ll reply to your email soon.', false);
          } else {
            setStatus('Couldn’t send that -- try again, or email us directly at reservations@palmspringsadventureclub.com.', true);
          }
        })
        .catch(function () {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send';
          setStatus('Couldn’t send that -- try again, or email us directly at reservations@palmspringsadventureclub.com.', true);
        });
    });
  }
})();
</script>
<script src="/adventure-prep-form.js"></script>
</body>
</html>
