<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reconciliation Review | PSAC Ops</title>
<!--
  ops-reconciliation-review.html

  Real, working version of claude/psac-ops-reconciliation-review.html's
  mockup — Gear Inventory PRD Section 7/10/11. This page only ever shows
  Scenario 4 bookings (itemized loss exceeds the hold) — Scenarios 1-3
  resolve automatically inside api/reconcile-gear-deposit.js with no staff
  action. Staff review photos, optionally adjust the computed shortfall
  (a required note unlocks the button when adjusted, same "required reason
  unlocks the button" interaction as Trail Swap Requests), and trigger the
  follow-up charge. The refund/partial-refund entry point below closes the
  gap the design pass flagged: there was previously no staff-facing way to
  reverse a deposit capture or a shortfall charge at all.

  Wired to /api/ops-proxy -> api/reconcile-gear-deposit.js (list/context),
  api/charge-gear-shortfall.js, and api/refund-gear-charge.js.

  Round 2 (Aug 2026): retrofitted to the shared OpsShell (ops-shell.js/.css)
  — no functional change to the reconciliation flow itself.
-->
<link rel="stylesheet" href="ops-shell.css">
<style>
  .ops-input, .ops-select { padding:0.6rem 0.8rem; border:1px solid var(--ops-border); border-radius:5px; font-size:0.85rem; background:white; }
  .ops-textarea { width:100%; border:1px solid var(--ops-border); border-radius:5px; padding:0.6rem 0.8rem; font-size:0.82rem; font-family:inherit; min-height:56px; margin-top:0.5rem; }
  .ops-btn { background:var(--dark-pine); color:white; border:none; border-radius:5px; padding:0.55rem 1rem; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .ops-btn:disabled { opacity:0.4; cursor:default; }
  .ops-btn-secondary { background:white; border:1px solid var(--ops-border); color:var(--ops-text); border-radius:5px; padding:0.5rem 0.9rem; font-size:0.78rem; cursor:pointer; }
  .ops-empty { text-align:center; padding:2rem 1rem; color:var(--ops-text-mid); font-size:0.85rem; }
  .ops-table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .ops-table th { text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); padding:0.6rem 0.8rem; border-bottom:2px solid var(--ops-border); }
  .ops-table td { padding:0.6rem 0.8rem; border-bottom:1px solid var(--ops-border); vertical-align:middle; }

  .ops-panel { border:1px solid var(--ops-border); border-radius:8px; padding:1.2rem 1.4rem; margin-bottom:1.2rem; }
  .ops-panel-title { font-size:0.9rem; font-weight:700; margin-bottom:0.7rem; color:var(--dark-pine); }
  .ops-field-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:1rem; margin-bottom:1rem; }
  .ops-field-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ops-text-mid); margin-bottom:0.2rem; }
  .ops-field-value { font-size:1rem; font-weight:700; color:var(--dark-pine); }

  .settle-summary { display:flex; justify-content:space-between; padding:0.4rem 0; font-size:0.85rem; }
  .settle-summary.total { font-weight:700; border-top:1px solid var(--ops-border); margin-top:0.3rem; padding-top:0.6rem; }

  .amount-row { display:flex; align-items:center; gap:0.8rem; margin:1rem 0; }
  .amount-row input { width:140px; font-size:1.1rem; font-weight:700; text-align:right; }
  .amount-note { display:none; margin-top:0.6rem; }
  .amount-note.show { display:block; }

  .item-row-photo { display:inline-block; font-size:0.7rem; background:var(--ops-bg); border:1px solid var(--ops-border); border-radius:3px; padding:0.1rem 0.4rem; text-decoration:none; color:var(--ops-text); }

  .ops-success-banner { background:rgba(122,189,145,0.15); color:#2a7a4a; border:1px solid rgba(122,189,145,0.4); border-radius:6px; padding:0.7rem 1rem; margin-bottom:1rem; font-size:0.82rem; }

  @media (max-width: 760px) {
    .ops-field-grid { grid-template-columns:1fr 1fr; }
    .ops-table { display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .amount-row { flex-wrap:wrap; }
    .amount-row input { width:120px; }
  }
</style>
</head>
<body>

<div id="loading-gate">Checking sign-in…</div>

<div id="app-shell" class="hidden">
  <div class="ops-app">
    <div class="ops-sidebar" id="ops-sidebar"></div>
    <div class="ops-main">
      <div class="ops-topbar">
        <div>
          <div class="ops-title" id="ops-title"></div>
          <div class="ops-subtitle" id="ops-subtitle"></div>
        </div>
        <div class="ops-user"><span id="user-email"></span><button class="ops-signout" id="signout-btn">Sign out</button></div>
      </div>
      <div id="ops-search-container"></div>

      <div id="banner-container"></div>

      <div id="queue-view">
        <div id="queue-list"><div class="ops-empty">Loading…</div></div>
      </div>

      <div id="detail-view" class="hidden">
        <div class="ops-breadcrumb"><a id="back-to-queue">&larr; Reconciliation Review</a></div>
        <div id="detail-content"></div>
      </div>
    </div>
  </div>
</div>

<script src="ops-shell.js"></script>
<script>
(function () {
  'use strict';

  var currentBookingId = null;
  var currentCtx = null;

  var opsCall = OpsShell.opsCall;
  var escapeHtml = OpsShell.escapeHtml;

  function centsToDollars(cents) {
    return ((Number(cents) || 0) / 100).toFixed(2);
  }

  function showBanner(kind, message) {
    var cls = kind === 'success' ? 'ops-success-banner' : 'ops-error-banner';
    document.getElementById('banner-container').innerHTML = '<div class="' + cls + '">' + escapeHtml(message) + '</div>';
  }

  function loadQueue() {
    OpsShell.withLoadingState(document.getElementById('queue-list'), function () {
      return opsCall('gearReconcile_list', {}).then(function (result) {
        if (!result.ok) { document.getElementById('queue-list').innerHTML = '<div class="ops-empty">Could not load the reconciliation queue.</div>'; return; }
        var bookings = result.data.bookings || [];
        if (!bookings.length) { document.getElementById('queue-list').innerHTML = '<div class="ops-empty">Nothing pending review right now.</div>'; return; }
        var rows = bookings.map(function (b) {
          var statusLabel = b.depositStatus === 'shortfall_charged' ? 'Shortfall charged' : 'Pending review';
          return '<tr><td>#' + escapeHtml(b.bookingId) + ' — ' + escapeHtml(b.contactName || '') + '</td>'
            + '<td>' + escapeHtml(b.tripDate || '') + '</td>'
            + '<td>' + statusLabel + '</td>'
            + '<td>$' + centsToDollars(b.gearShortfallCents) + '</td>'
            + '<td><button class="ops-btn" style="padding:0.35rem 0.7rem;" data-open="' + escapeHtml(b.bookingId) + '">Review</button></td></tr>';
        }).join('');
        document.getElementById('queue-list').innerHTML = '<table class="ops-table"><thead><tr><th>Booking</th><th>Trail day</th><th>Status</th><th>Shortfall</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
        document.querySelectorAll('button[data-open]').forEach(function (btn) {
          btn.addEventListener('click', function () { openBooking(btn.getAttribute('data-open')); });
        });
      });
    });
  }

  function openBooking(bookingId) {
    currentBookingId = bookingId;
    document.getElementById('queue-view').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    document.getElementById('detail-content').innerHTML = '<div class="ops-empty">Loading…</div>';
    opsCall('gearReconcile_getContext', { bookingId: bookingId }).then(function (result) {
      if (!result.ok || result.data.notFound) { document.getElementById('detail-content').innerHTML = '<div class="ops-empty">Could not load this booking.</div>'; return; }
      currentCtx = result.data;
      renderDetail();
    });
  }

  function renderDetail() {
    var ctx = currentCtx;
    var holdCents = ctx.reconciledAmountCents || 0;
    var shortfallCents = ctx.gearShortfallCents || 0;
    var itemizedCents = holdCents + shortfallCents;
    var chargeableItems = (ctx.items || []).filter(function (i) { return i.condition === 'Damaged' || i.condition === 'Missing'; });
    var alreadyCharged = ctx.depositStatus === 'shortfall_charged';

    var html = '<div class="ops-panel">'
      + '<div class="ops-field-grid">'
      + '<div><div class="ops-field-label">Deposit hold</div><div class="ops-field-value">$' + centsToDollars(holdCents) + '</div></div>'
      + '<div><div class="ops-field-label">Already captured</div><div class="ops-field-value">$' + centsToDollars(holdCents) + ' (full hold)</div></div>'
      + '<div><div class="ops-field-label">Itemized total</div><div class="ops-field-value">$' + centsToDollars(itemizedCents) + '</div></div>'
      + '<div><div class="ops-field-label">Computed shortfall</div><div class="ops-field-value">$' + centsToDollars(shortfallCents) + '</div></div>'
      + '</div>'
      + '<div class="ops-panel-title" style="font-size:0.85rem;">Itemized Damaged / Missing</div>'
      + '<table class="ops-table"><thead><tr><th>Item</th><th>Condition</th><th>Photo</th><th>Replacement cost</th></tr></thead><tbody>'
      + chargeableItems.map(function (i) {
          return '<tr><td>' + escapeHtml(i.itemName) + ' — ' + escapeHtml(i.unitId) + '</td>'
            + '<td>' + escapeHtml(i.condition) + '</td>'
            + '<td>' + (i.photoUrl ? '<a class="item-row-photo" href="' + escapeHtml(i.photoUrl) + '" target="_blank" rel="noopener">View</a>' : '&mdash;') + '</td>'
            + '<td>$' + centsToDollars(i.replacementCostCents) + '</td></tr>';
        }).join('')
      + '</tbody></table>'
      + '<div class="settle-summary total"><span>Itemized total</span><span>$' + centsToDollars(itemizedCents) + '</span></div>'
      + '<div class="settle-summary"><span>&minus; Already captured from hold</span><span>$' + centsToDollars(holdCents) + '</span></div>'
      + '<div class="settle-summary total"><span>Shortfall</span><span>$' + centsToDollars(shortfallCents) + '</span></div>'
      + '</div>';

    if (alreadyCharged) {
      html += '<div class="ops-panel"><div class="ops-panel-title">Shortfall already charged</div>'
        + '<p style="font-size:0.85rem;">Charged $' + centsToDollars(ctx.shortfallChargedAmountCents) + ' on ' + escapeHtml(ctx.shortfallChargedAt || '') + ' (PaymentIntent ' + escapeHtml(ctx.shortfallChargeId || '') + ').</p></div>';
    } else {
      html += '<div class="ops-panel">'
        + '<div class="ops-panel-title">Charge the shortfall</div>'
        + '<div class="amount-row"><label style="font-size:0.78rem; color:var(--ops-text-mid);">Amount to charge</label>'
        + '<input class="ops-input" id="charge-amount" type="number" step="0.01" min="0.01" value="' + centsToDollars(shortfallCents) + '"></div>'
        + '<div class="amount-note" id="charge-note-wrap"><textarea class="ops-textarea" id="charge-note" placeholder="Required — why does this differ from the computed shortfall?"></textarea></div>'
        + '<div class="ops-panel-footer" style="display:flex; justify-content:flex-end;"><button class="ops-btn" id="charge-submit">Charge $' + centsToDollars(shortfallCents) + '</button></div>'
        + '</div>';
    }

    html += '<div class="ops-panel">'
      + '<div class="ops-panel-title">Issue a refund</div>'
      + '<p style="font-size:0.8rem; color:var(--ops-text-mid); margin-bottom:0.8rem;">For a recovered item, or a charge that needs to be reversed or partially reversed.</p>'
      + '<div class="ops-field-grid" style="grid-template-columns:1fr 1fr;">'
      + '<div class="ops-form-row"><label style="font-size:0.72rem; text-transform:uppercase; color:var(--ops-text-mid);">Refund target</label>'
      + '<select class="ops-select" id="refund-target" style="width:100%;"><option value="deposit">Deposit capture</option><option value="shortfall"' + (alreadyCharged ? '' : ' disabled') + '>Shortfall charge' + (alreadyCharged ? '' : ' (not charged yet)') + '</option></select></div>'
      + '<div class="ops-form-row"><label style="font-size:0.72rem; text-transform:uppercase; color:var(--ops-text-mid);">Amount (blank = full remaining)</label>'
      + '<input class="ops-input" id="refund-amount" type="number" step="0.01" min="0.01" style="width:100%;"></div>'
      + '</div>'
      + '<textarea class="ops-textarea" id="refund-note" placeholder="Reason for this refund (required)"></textarea>'
      + '<div class="ops-panel-footer" style="display:flex; justify-content:flex-end;"><button class="ops-btn-secondary" id="refund-submit">Issue Refund</button></div>'
      + '</div>';

    document.getElementById('detail-content').innerHTML = html;
    wireDetailEvents(shortfallCents);
  }

  function wireDetailEvents(computedShortfallCents) {
    var chargeAmountInput = document.getElementById('charge-amount');
    var chargeSubmitBtn = document.getElementById('charge-submit');
    if (chargeAmountInput) {
      chargeAmountInput.addEventListener('input', function () {
        var enteredCents = Math.round(Number(chargeAmountInput.value || 0) * 100);
        var differs = enteredCents !== computedShortfallCents;
        document.getElementById('charge-note-wrap').classList.toggle('show', differs);
        chargeSubmitBtn.textContent = 'Charge $' + (Number(chargeAmountInput.value || 0)).toFixed(2);
      });
      chargeSubmitBtn.addEventListener('click', function () {
        var enteredCents = Math.round(Number(chargeAmountInput.value || 0) * 100);
        var differs = enteredCents !== computedShortfallCents;
        var note = document.getElementById('charge-note').value.trim();
        if (differs && !note) { showBanner('error', 'A note is required when the charge amount is adjusted from the computed shortfall.'); return; }
        if (!enteredCents || enteredCents <= 0) { showBanner('error', 'Enter a positive charge amount.'); return; }
        chargeSubmitBtn.disabled = true;
        opsCall('gearShortfall_charge', { bookingId: currentBookingId, amountCents: enteredCents, staffNotes: note }).then(function (result) {
          chargeSubmitBtn.disabled = false;
          if (!result.ok || result.data.ok === false) { showBanner('error', (result.data && result.data.detail) || 'Could not process this charge.'); return; }
          showBanner('success', 'Shortfall charged.');
          openBooking(currentBookingId);
        });
      });
    }

    document.getElementById('refund-submit').addEventListener('click', function () {
      var target = document.getElementById('refund-target').value;
      var amountStr = document.getElementById('refund-amount').value;
      var note = document.getElementById('refund-note').value.trim();
      if (!note) { showBanner('error', 'A reason is required to issue a refund.'); return; }
      var payload = { bookingId: currentBookingId, refundTarget: target, staffNotes: note };
      if (amountStr !== '') payload.amountCents = Math.round(Number(amountStr) * 100);
      opsCall('gearRefund_issue', payload).then(function (result) {
        if (!result.ok) { showBanner('error', (result.data && result.data.error) || 'Could not issue this refund.'); return; }
        showBanner('success', 'Refund issued for $' + centsToDollars(result.data.refundAmountCents) + '.');
        openBooking(currentBookingId);
      });
    });
  }

  OpsShell.boot({
    activeHref: 'ops-reconciliation-review.html',
    title: 'Reconciliation Review',
    subtitle: 'Scenario 4 only — itemized loss/damage exceeded the deposit hold and needs a human decision before the follow-up charge fires.',
    onReady: function () {
      document.getElementById('back-to-queue').addEventListener('click', function () {
        document.getElementById('detail-view').classList.add('hidden');
        document.getElementById('queue-view').classList.remove('hidden');
        loadQueue();
      });
      loadQueue();
    },
  });
})();
</script>
</body>
</html>
